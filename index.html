<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Guerreiros da Luz</title>
<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* ===== BODY ===== */
body{
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  overflow-x:hidden;
}

/* ===== TELAS ===== */
.tela{
  display:none;
  text-align:center;
}

.tela.ativa{
  display:block;
}

/* ===== TÍTULO ===== */
.titulo{
  font-size:42px;
  font-weight:900;
  margin-bottom:25px;
  text-transform:uppercase;
  letter-spacing:3px;
  color:#ffd966;
  text-shadow:
    1px 1px 0 #c9a227,
    2px 2px 0 #b8941f,
    3px 3px 0 #9e7c19,
    4px 4px 0 #7d5f12,
    6px 6px 10px rgba(0,0,0,0.8);
}

/* ===== EFEITO VENTO ===== */
.vento{
  animation: vento3D 3s infinite ease-in-out;
}

@keyframes vento3D{
  0%{ transform: translateX(0) skewX(0deg); opacity:1; }
  40%{ transform: translateX(-6px) skewX(-6deg); }
  70%{ transform: translateX(-14px) skewX(-14deg); opacity:0.85; }
  100%{ transform: translateX(0) skewX(0deg); opacity:1; }
}

/* ===== PENTÁGONO ===== */
.pentagono{
  width:520px;
  height:520px;
  background:url("logonovo.png") center/cover no-repeat;
  clip-path: polygon(
    50% 0%,
    100% 38%,
    82% 100%,
    18% 100%,
    0% 38%
  );
  margin: 0 auto 20px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* ===== FOGO EXTERNO ===== */
.fogo{
  position:absolute;
  top:-15px;
  left:-15px;
  right:-15px;
  bottom:-15px;
  border-radius:5px;
  pointer-events:none;
  box-shadow: 0 0 40px 15px orange, 0 0 60px 25px red, 0 0 80px 35px yellow;
  opacity:0;
  animation: fogoAnim 1s infinite alternate;
}

@keyframes fogoAnim{
  0%{ opacity:0; box-shadow:0 0 40px 15px orange,0 0 60px 25px red,0 0 80px 35px yellow; }
  50%{ opacity:1; box-shadow:0 0 50px 20px orange,0 0 70px 30px red,0 0 100px 40px yellow; }
  100%{ opacity:0.8; box-shadow:0 0 60px 25px orange,0 0 80px 35px red,0 0 120px 50px yellow; }
}

/* ===== BOTÕES ===== */
button{
  padding:12px 22px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#ffd966;
  cursor:pointer;
  font-weight:bold;
  margin:5px 0;
}

button:hover{
  background:#ffcc00;
}

/* ===== PLACAR ===== */
#placar{
  margin:15px 0;
  font-size:18px;
}

/* ===== PERGUNTA ===== */
#pergunta{
  margin-bottom:15px;
  font-size:20px;
}

/* ===== CONFETES ===== */
.confete{
  position:fixed;
  width:10px;
  height:10px;
  background:orange;
  top:-10px;
  animation: cair 3s linear infinite;
  opacity:0.8;
  border-radius:50%;
}

@keyframes cair{
  0%{ transform: translateY(0) rotate(0deg); }
  100%{ transform: translateY(100vh) rotate(360deg); }
}
</style>
</head>
<body>

<!-- ===== TELA INICIAL ===== -->
<div id="inicio" class="tela ativa">
  <div class="titulo vento">Guerreiros da Luz</div>
  <div class="pentagono"><div class="fogo" id="fogo"></div></div>

  <button onclick="selecionarFase('iniciante')">Missão Iniciante</button><br>
  <button onclick="selecionarFase('intermediario')">Missão Intermediária</button><br>
  <button onclick="selecionarFase('avancado')">Missão Avançada</button><br>
  <button onclick="selecionarFase('hard')">Missão Hard</button>
</div>

<!-- ===== TELA DO JOGO ===== -->
<div id="fases" class="tela">
  <div id="placar">
    Pontuação: <span id="pontos">0</span>
  </div>

  <h3 id="pergunta"></h3>

  <button id="op0" onclick="responder(0)"></button><br><br>
  <button id="op1" onclick="responder(1)"></button><br><br>
  <button id="op2" onclick="responder(2)"></button>
</div>

<!-- ===== AUDIO ===== -->
<audio id="audioBg" loop>
  <source src="som.mp3" type="audio/mpeg">
</audio>

<script>
// ===== CONTROLE DE TELAS =====
function trocarTela(id){
  document.querySelectorAll(".tela").forEach(t=>{
    t.classList.remove("ativa");
  });
  document.getElementById(id).classList.add("ativa");
}

// ===== VARIÁVEIS =====
let pontos = 0;
let indicePergunta = 0;
let nivelAtual = "iniciante";
const audio = document.getElementById("audioBg");
const fogo = document.getElementById("fogo");

// ===== BANCO DE PERGUNTAS =====
const bancoPerguntas = {
  iniciante:[
    { texto:"Quem construiu a arca?", opcoes:["Moisés","Noé","Abraão"], correta:1 },
    { texto:"Quem abriu o Mar Vermelho?", opcoes:["Josué","Moisés","Elias"], correta:1 },
    { texto:"Quem foi o primeiro homem criado por Deus?", opcoes:["Adão","Noé","Abraão"], correta:0 },
    { texto:"Quem foi engolido por um grande peixe?", opcoes:["Jonas","Pedro","Paulo"], correta:0 },
    { texto:"Onde Jesus nasceu?", opcoes:["Belém","Jerusalém","Nazaré"], correta:0 },
    { texto:"Quem derrotou o gigante Golias?", opcoes:["Saul","Davi","Sansão"], correta:1 }
  ],

  intermediario:[
    { texto:"Quem subiu ao céu sem morrer?", opcoes:["Elias","Moisés","Abraão"], correta:0 },
    { texto:"Quantos mandamentos Deus deu a Moisés?", opcoes:["5","10","12"], correta:1 },
    { texto:"Quem interpretou os sonhos do faraó?", opcoes:["José","Daniel","Jacó"], correta:0 },
    { texto:"Qual livro vem depois de Salmos?", opcoes:["Provérbios","Jó","Eclesiastes"], correta:0 },
    { texto:"Quem foi o rei mais sábio de Israel?", opcoes:["Davi","Salomão","Saul"], correta:1 }
  ],

  avancado:[
    { texto:"Quantos dias choveu no dilúvio?", opcoes:["30","40","50"], correta:1 },
    { texto:"Qual profeta desafiou os profetas de Baal?", opcoes:["Elias","Eliseu","Isaías"], correta:0 },
    { texto:"Quem escreveu a maioria dos Salmos?", opcoes:["Salomão","Davi","Asafe"], correta:1 },
    { texto:"Qual apóstolo negou Jesus três vezes?", opcoes:["João","Pedro","Tomé"], correta:1 },
    { texto:"Em qual monte Moisés recebeu os 10 mandamentos?", opcoes:["Sinai","Carmelo","Horebe"], correta:0 }
  ],

  hard:[
    { texto:"Quem foi traído por Judas?", opcoes:["Jesus","Pedro","Paulo"], correta:0 },
    { texto:"Quantos discípulos Jesus tinha?", opcoes:["12","10","14"], correta:0 },
    { texto:"Quem foi lançado na fornalha?", opcoes:["Sadraque","Mesaque","Abednego"], correta:2 },
    { texto:"Quem escreveu a Epístola aos Hebreus?", opcoes:["Paulo","Lucas","Desconhecido"], correta:2 },
    { texto:"Qual profeta teve visão do vale de ossos secos?", opcoes:["Ezequiel","Isaías","Jeremias"], correta:0 }
  ]
};


let perguntas = bancoPerguntas.iniciante;

// ===== INICIAR MISSÃO =====
function selecionarFase(fase){
  if(!bancoPerguntas[fase]){
    alert("Missão não disponível!");
    return;
  }

  nivelAtual = fase;
  perguntas = bancoPerguntas[fase];
  pontos = 0;
  indicePergunta = 0;
  document.getElementById("pontos").innerText = pontos;

  trocarTela("fases");
  carregarPergunta();

  if(audio.paused) audio.play();
}

// ===== CARREGAR PERGUNTA =====
function carregarPergunta(){
  let p = perguntas[indicePergunta];
  document.getElementById("pergunta").innerText = p.texto;
  document.getElementById("op0").innerText = p.opcoes[0];
  document.getElementById("op1").innerText = p.opcoes[1];
  document.getElementById("op2").innerText = p.opcoes[2];
}

// ===== RESPONDER =====
function responder(opcao){
  let correta = perguntas[indicePergunta].correta;

  // ===== Pontuação diferenciada para Hard =====
  let pontosAcerto = (nivelAtual === "hard") ? 20 : 10;
  let pontosErro   = (nivelAtual === "hard") ? 10 : 5;

  if(opcao === correta){
    pontos += pontosAcerto;
    alert("Resposta correta! ⚔️🔥");
  }else{
    pontos -= pontosErro;
    if(pontos < 0) pontos = 0;
    alert("Resposta errada 😬");
  }

  document.getElementById("pontos").innerText = pontos;

  indicePergunta++;

  if(indicePergunta < perguntas.length){
    carregarPergunta();
  }else{
    // ===== Missão concluída com fogo e confetes =====
    audio.pause();
    fogo.style.opacity = 1;
    criarConfetes(50);
    alert("Missão concluída! 🏆🔥");

    setTimeout(()=>{
      fogo.style.opacity = 0;
      trocarTela("inicio");
    },2000);
  }
}

// ===== CONFETES =====
function criarConfetes(qtd){
  for(let i=0;i<qtd;i++){
    let c = document.createElement("div");
    c.classList.add("confete");
    c.style.left = Math.random()*window.innerWidth+"px";
    c.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
    c.style.animationDuration = (2+Math.random()*3)+"s";
    document.body.appendChild(c);

    setTimeout(()=>document.body.removeChild(c),5000);
  }
}
</script>
</body>
</html>
