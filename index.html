}

body{

}

.tela{
  display:none;

}

}

.titulo{

    82% 100%,
    18% 100%,

  margin:0 auto 20px;
}

button{

  font-size:16px;
  border:none;
  border-radius:6px;
  background:#ffd966;
  font-weight:bold;
  cursor:pointer;
}

button:hover{

}

#placar{
  margin:10px 0;
  font-size:18px;
}

#pergunta{
  margin:15px 0;
  font-size:20px;
}

#versiculo{
  display:none;
  margin-top:15px;
  font-style:italic;
  color:#ffd966;
}
</style>
</head>

function trocarTela(id){
  document.querySelectorAll(".tela").forEach(t=>{
    t.classList.remove("ativa");

  document.getElementById(id).classList.add("ativa");
}

  localStorage.setItem("xp", xp);

}

function carregarProgresso(){
  xp = Number(localStorage.getItem("xp")) || 0;
  nivelJogador = Number(localStorage.getItem("nivelJogador")) || 1;
}

function atualizarNivel(){
  nivelJogador = Math.floor(xp / 100) + 1;

// ===== INICIAR MISSÃO =====
function selecionarFase(fase){
  perguntas = bancoPerguntas[fase];
  indicePergunta = 0;
  pontos = 0;
  document.getElementById("pontos").innerText = pontos;
document.getElementById("xp").innerText = xp;
document.getElementById("nivelJogador").innerText = nivelJogador;

  trocarTela("fases");
  carregarPergunta();

  if(audio.paused){
    audio.play();
  }
}

// ===== CARREGAR PERGUNTA =====
function carregarPergunta(){
  let p = perguntas[indicePergunta];

  document.getElementById("pergunta").innerText = p.texto;
  document.getElementById("op0").innerText = p.opcoes[0];
  document.getElementById("op1").innerText = p.opcoes[1];
  document.getElementById("op2").innerText = p.opcoes[2];

  const versiculoEl = document.getElementById("versiculo");
  versiculoEl.style.display = "none";
  versiculoEl.innerText = "";
}

// ===== RESPONDER =====
function responder(opcao){
  let p = perguntas[indicePergunta];
  const versiculoEl = document.getElementById("versiculo");

  if(opcao === p.correta){
   pontos += 10;
xp += 10;
atualizarNivel();

document.getElementById("xp").innerText = xp;
document.getElementById("nivelJogador").innerText = nivelJogador;

    alert("Resposta correta! ✅");
  }else{
    alert("Resposta errada ❌");
  }

  versiculoEl.innerText = "📖 " + p.versiculo;
  versiculoEl.style.display = "block";

  setTimeout(()=>{
    indicePergunta++;
    if(indicePergunta < perguntas.length){
      carregarPergunta();
    }else{
      alert("Missão concluída! 🏆🔥");
      audio.pause();
      trocarTela("inicio");
    }
  },2000);
window.onload = function(){
  carregarProgresso();
};

}
