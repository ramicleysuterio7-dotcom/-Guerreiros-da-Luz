<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Guerreiros da Luz</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.tela{
  display:none;
  text-align:center;
}

.tela.ativa{
  display:block;
}

.titulo{
  font-size:42px;
  font-weight:900;
  margin-bottom:20px;
  text-transform:uppercase;
  color:#ffd966;
  text-shadow:
    1px 1px 0 #c9a227,
    2px 2px 0 #b8941f,
    3px 3px 0 #9e7c19,
    5px 5px 10px rgba(0,0,0,0.8);
}

.pentagono{
  width:520px;
  height:520px;
  background:url("logonovo.png") center/cover no-repeat;
  clip-path: polygon(
    50% 0%,
    100% 38%,
    82% 100%,
    18% 100%,
    0% 38%
  );
  margin:0 auto 20px;
}

button{
  padding:12px 22px;
  margin:6px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#ffd966;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ffcc00;
}

#placar{
  margin:10px 0;
  font-size:18px;
}

#pergunta{
  margin:15px 0;
  font-size:20px;
}

#versiculo{
  display:none;
  margin-top:15px;
  font-style:italic;
  color:#ffd966;
}
</style>
</head>

<body>

<!-- ===== TELA INICIAL ===== -->
<div id="inicio" class="tela ativa">
  <div class="titulo">Guerreiros da Luz</div>
  <div class="pentagono"></div>

  <button onclick="selecionarFase('iniciante')">Missão Iniciante</button><br>
  <button onclick="selecionarFase('intermediario')">Missão Intermediária</button><br>
  <button onclick="selecionarFase('avancado')">Missão Avançada</button><br>
  <button onclick="selecionarFase('hard')">Missão Hard</button><br>
  <button onclick="selecionarFase('ebd')">Missão EBD</button>
</div>

<!-- ===== TELA DO JOGO ===== -->
<div id="fases" class="tela">
  <div id="placar">
    Pontuação: <span id="pontos">0</span>
  </div>

  <h3 id="pergunta"></h3>

  <button id="op0" onclick="responder(0)"></button><br><br>
  <button id="op1" onclick="responder(1)"></button><br><br>
  <button id="op2" onclick="responder(2)"></button>

  <p id="versiculo"></p>
</div>

<audio id="audioBg" loop>
  <source src="som.mp3" type="audio/mpeg">
</audio>

<script>

function trocarTela(id){
  document.querySelectorAll(".tela").forEach(t=>{
    t.classList.remove("ativa");
  });
  document.getElementById(id).classList.add("ativa");
}

// ===== VARIÁVEIS =====

let indicePergunta = 0;
let perguntas = [];

const audio = document.getElementById("audioBg");

  { texto:"Qual é o último livro da Bíblia?", versiculo:"Apocalipse 1:1", opcoes:["Judas","Hebreus","Apocalipse"], correta:2 },

  { texto:"Qual animal falou com Balaão?", versiculo:"Números 22:28", opcoes:["Cavalo","Jumento","Camelo"], correta:1 },
  { texto:"Quem foi lançado na cova dos leões?", versiculo:"Daniel 6", opcoes:["José","Daniel","Davi"], correta:1 },
  { texto:"Quem foi chamado amigo de Deus?", versiculo:"Tiago 2:23", opcoes:["Abraão","Moisés","Noé"], correta:0 },
  { texto:"Quem construiu o templo?", versiculo:"1 Reis 6", opcoes:["Davi","Salomão","Saul"], correta:1 },
  { texto:"Quem escreveu muitos provérbios?", versiculo:"Provérbios 1:1", opcoes:["Davi","Salomão","Ezequiel"], correta:1 },
  { texto:"Quem foi vendido por moedas de prata?", versiculo:"Gênesis 37:28", opcoes:["José","Jesus","Sansão"], correta:0 },
  { texto:"Quem ressuscitou Lázaro?", versiculo:"João 11:43", opcoes:["Pedro","Jesus","Paulo"], correta:1 }
],

  { texto:"Quem subiu ao céu sem morrer?", versiculo:"2 Reis 2:11", opcoes:["Elias","Moisés","Abraão"], correta:0 },
  { texto:"Quem escreveu Atos dos Apóstolos?", versiculo:"Atos 1:1", opcoes:["Paulo","Lucas","Pedro"], correta:1 },
  { texto:"Quem teve um sonho com uma escada até o céu?", versiculo:"Gênesis 28:12", opcoes:["José","Jacó","Isaque"], correta:1 },
  { texto:"Quem foi rei antes de Davi?", versiculo:"1 Samuel 10", opcoes:["Saul","Salomão","Josué"], correta:0 },

  { texto:"Qual rei pediu sabedoria a Deus?", versiculo:"1 Reis 3:9", opcoes:["Davi","Salomão","Saul"], correta:1 },
  { texto:"Quem escreveu o livro de Ruth?", versiculo:"Rute 1:1", opcoes:["Samuel","Desconhecido","Davi"], correta:1 },
  { texto:"Quem teve visão dos ossos secos?", versiculo:"Ezequiel 37", opcoes:["Isaías","Ezequiel","Jeremias"], correta:1 },
  { texto:"Qual profeta anunciou o novo concerto?", versiculo:"Jeremias 31:31", opcoes:["Daniel","Jeremias","Oséias"], correta:1 },
  { texto:"Quem escreveu o livro de Jonas?", versiculo:"Jonas 1:1", opcoes:["Jonas","Naum","Habacuque"], correta:0 }

  avancado:[
    { texto:"Quantos dias choveu no dilúvio?", versiculo:"Gênesis 7:12", opcoes:["30","40","150"], correta:1 },
    { texto:"Quem interpretou o sonho da estátua?", versiculo:"Daniel 2:19", opcoes:["José","Daniel","Ezequiel"], correta:1 },
    { texto:"Qual rei viu a escrita na parede?", versiculo:"Daniel 5:5", opcoes:["Nabucodonosor","Belsazar","Ciro"], correta:1 },

  ],

    { texto:"Quem escreveu Hebreus?", versiculo:"Hebreus 1:1", opcoes:["Paulo","Lucas","Autor desconhecido"], correta:2 },
    { texto:"Quem teve visão dos ossos secos?", versiculo:"Ezequiel 37", opcoes:["Isaías","Jeremias","Ezequiel"], correta:2 },

    { texto:"O que significa Emanuel?", versiculo:"Mateus 1:23", opcoes:["Deus conosco","Rei eterno","Príncipe da Paz"], correta:0 }
  ],

  ebd:[
    { texto:"Tema central da Bíblia?", versiculo:"Lucas 24:27", opcoes:["Israel","Redenção","Lei"], correta:1 },
    { texto:"O que significa EBD?", versiculo:"Atos 2:42", opcoes:["Estudo Bíblico Diário","Escola Bíblica Dominical","Ensino Doutrinário"], correta:1 },
    { texto:"Livro considerado o coração da Bíblia?", versiculo:"Salmos 119:105", opcoes:["Salmos","Romanos","Isaías"], correta:0 },
    { texto:"Apóstolo dos gentios?", versiculo:"Romanos 11:13", opcoes:["Pedro","Paulo","Barnabé"], correta:1 },
    { texto:"O que é justificação?", versiculo:"Romanos 5:1", opcoes:["Pelas obras","Pela fé","Pela lei"], correta:1 }
  ]
};

// ===== INICIAR MISSÃO =====
function selecionarFase(fase){
  perguntas = bancoPerguntas[fase];
  indicePergunta = 0;
  pontos = 0;
  document.getElementById("pontos").innerText = pontos;

  trocarTela("fases");
  carregarPergunta();

  if(audio.paused){
    audio.play();
  }
}

// ===== CARREGAR PERGUNTA =====
function carregarPergunta(){
  let p = perguntas[indicePergunta];

  document.getElementById("pergunta").innerText = p.texto;
  document.getElementById("op0").innerText = p.opcoes[0];
  document.getElementById("op1").innerText = p.opcoes[1];
  document.getElementById("op2").innerText = p.opcoes[2];

  const versiculoEl = document.getElementById("versiculo");
  versiculoEl.style.display = "none";
  versiculoEl.innerText = "";
}

// ===== RESPONDER =====
function responder(opcao){
  let p = perguntas[indicePergunta];
  const versiculoEl = document.getElementById("versiculo");

  if(opcao === p.correta){
    pontos += 10;
    document.getElementById("pontos").innerText = pontos;
    alert("Resposta correta! ✅");
  }else{
    alert("Resposta errada ❌");
  }

  versiculoEl.innerText = "📖 " + p.versiculo;
  versiculoEl.style.display = "block";

  setTimeout(()=>{
    indicePergunta++;
    if(indicePergunta < perguntas.length){
      carregarPergunta();
    }else{
      alert("Missão concluída! 🏆🔥");
      audio.pause();
      trocarTela("inicio");
    }
  },2000);
}
</script>

</body>
</html>
